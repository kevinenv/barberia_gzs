services:
  db:
    image: mysql:8.0
    container_name: barberia_gzs_mysql_cloud
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: kevinnunezortiz/barberia-gzs-backend:latest
    container_name: barberia_gzs_backend_cloud
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      GIN_MODE: release

  frontend:
    image: kevinnunezortiz/barberia-gzs-frontend:latest
    container_name: barberia_gzs_frontend_cloud
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data: