name: CI/CD - Barberia GZS a Docker Hub

on:
  push:
    branches:
      - main

jobs:
  # TRABAJO 1: Verificar que el código en Go compile sin errores antes de publicar nada
  verificar-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Verificar análisis estático y compilación de Go
        working-directory: ./backend
        run: |
          go vet ./...
          go build -v ./cmd/api/main.go

  # TRABAJO 2: Construir imágenes Multi-Stage y publicarlas en Docker Hub
  publicar-dockerhub:
    needs: verificar-backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen del Backend (Go)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/barberia-gzs-backend:latest

      - name: Construir y subir imagen del Frontend (Vue 3 + Nginx)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/barberia-gzs-frontend:latest
